---
- name: Task03 - Loop
  hosts: localhost
  gather_facts: no
  vars:
    server_list:
      - UCSC-C220-M6S
      - UCSC-C220-M6N
      - UCSC-C240-M6SX

    server_dict:
      UCSC-C220-M6S:
        PSU: 'UCSC-PSU1-1050W'
        CPU: 'UCS-CPU-I4310'
      UCSC-C220-M6N:
        PSU: 'UCSC-PSU1-1600W'
        CPU: 'UCS-CPU-I6354'
      UCSC-C240-M6SX:
        PSU: 'UCSC-PSU1-2300W'
        CPU: 'UCS-CPU-I8380'


  tasks:
    - name: Print Variable server_list
      debug: 
        var: server_list

    - name: Loop through variable server_list
      debug: 
        var: item
      loop: "{{ server_list }}"

    - name: Print Variable server_dict
      debug: 
        var: server_dict

    - name: Loop through variable server_dict
      debug: 
        var: item.value.CPU
      loop: "{{ lookup('dict', server_dict) }}"
      when: item.key == 'UCSC-C220-M6N'

...