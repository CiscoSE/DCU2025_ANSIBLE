---
- name: Task03 - Loop
  hosts: localhost
  gather_facts: no

  tasks:
    - name: Read Input File
      read_csv:
        path: "scriptLeafList.csv"
        delimiter: ';'
      register: leaf_list
      delegate_to: localhost

    - name: Print Variable server_list
      debug: 
        var: leaf_list

    - name: Loop through variable leaf_list
      debug: 
        var: item
      loop: "{{ leaf_list.list | flatten(1) }}"

    - name: Pause
      pause:
        prompt: Continue with loop on a list of dictionaries.
                Press return to continue. Press Ctrl+c and then "a" to abort

    - name: Loop through variable switch_list_dict
      debug: 
        var: item
      loop: "{{ leaf_list.list | flatten(1) }}"
      when: item.leaf == '113'

...